name: Build & Release Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller flask pywebview patchright playwright

      - name: Bundle SAU (social-auto-upload) into DMG
        # 把 SAU 整套源码 + .venv 一起塞进 DMG，开箱即用，免去用户 git clone。
        # 体积换体验：用户首次启动不再需要手动配置 SAU_ROOT。
        run: |
          if [ ! -d "social-auto-upload" ]; then
            git clone --depth 1 https://github.com/dreamlin0317/social-auto-upload.git
          else
            echo "social-auto-upload/ already present, skipping clone"
          fi
          # 给 SAU 装一份独立 venv（不打进 .app 的 Python 解释器，但保留其 site-packages）
          python -m venv social-auto-upload/.venv || true
          source social-auto-upload/.venv/bin/activate
          pip install --upgrade pip
          # SAU requirements：uiautomator2 / schedule / tenacity / oss2 / filetype / loguru ...
          if [ -f social-auto-upload/requirements.txt ]; then
            pip install -r social-auto-upload/requirements.txt || true
          fi
          # patchright 浏览器是 SAU 也需要的（patches playwright for stealth）
          python -m patchright install chromium || true
          deactivate

      - name: Resolve version from VERSION file
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building version $VERSION"

      - name: Build macOS App with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --name "OpenMatrixPublisher" \
            --add-data "index.html:." \
            --add-data "app.html:." \
            --add-data "VERSION:." \
            --add-data "logo.png:." \
            --add-data "logo.svg:." \
            --add-data "favicon.ico:." \
            --add-data "showcase_banner.jpg:." \
            --add-data "interactive_login.py:." \
            --add-data "custom_uploaders:custom_uploaders" \
            --add-data "vendor/fontawesome:vendor/fontawesome" \
            --add-data "social-auto-upload/conf:social-auto-upload/conf" \
            --add-data "social-auto-upload/uploader:social-auto-upload/uploader" \
            --add-data "social-auto-upload/utils:social-auto-upload/utils" \
            --add-data "social-auto-upload/myUtils:social-auto-upload/myUtils" \
            --add-data "social-auto-upload/img:social-auto-upload/img" \
            --add-data "social-auto-upload/requirements.txt:social-auto-upload" \
            --hidden-import "uiautomator2" \
            --hidden-import "tenacity" \
            --hidden-import "loguru" \
            --hidden-import "filetype" \
            --icon "icon.icns" \
            desktop_app.py
          cd dist && zip -r "OpenMatrixPublisher-macOS.zip" "OpenMatrixPublisher.app"

      - name: Build macOS DMG (drag-to-install)
        run: |
          mkdir -p dmg_stage
          cp -R "dist/OpenMatrixPublisher.app" dmg_stage/
          ln -s /Applications dmg_stage/Applications
          hdiutil create -volname "Open Matrix Publisher" \
            -srcfolder dmg_stage -ov -format UDZO \
            "dist/OpenMatrixPublisher-${APP_VERSION}.dmg"
          # 稳定别名：官网下载链接永远指向 releases/latest/download/OpenMatrixPublisher.dmg，
          # 版本号变更无需再改 index.html
          cp "dist/OpenMatrixPublisher-${APP_VERSION}.dmg" "dist/OpenMatrixPublisher.dmg"

      - name: Smoke test packaged app (real macOS boot check)
        run: |
          ./dist/OpenMatrixPublisher.app/Contents/MacOS/OpenMatrixPublisher --selftest
          test -f selftest_result.json
          grep -q '"ok": true' selftest_result.json
          echo "macOS app selftest PASS"

      - name: Upload macOS Build Artifact (always, for testing)
        uses: actions/upload-artifact@v4
        with:
          name: OpenMatrixPublisher-macOS
          path: |
            dist/OpenMatrixPublisher-macOS.zip
            dist/OpenMatrixPublisher-${{ env.APP_VERSION }}.dmg
            dist/OpenMatrixPublisher.dmg

      - name: Upload macOS Release Asset
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/OpenMatrixPublisher-macOS.zip
            dist/OpenMatrixPublisher-${{ env.APP_VERSION }}.dmg
            dist/OpenMatrixPublisher.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller flask pywebview patchright playwright

      - name: Build Windows Executable
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "OpenMatrixPublisher-Setup" `
            --add-data "index.html;." `
            --add-data "app.html;." `
            --add-data "VERSION;." `
            --add-data "logo.png;." `
            --add-data "logo.svg;." `
            --add-data "favicon.ico;." `
            --add-data "showcase_banner.jpg;." `
            --add-data "interactive_login.py;." `
            --add-data "custom_uploaders;custom_uploaders" `
            --add-data "vendor/fontawesome;vendor/fontawesome" `
            --add-data "social-auto-upload/conf;social-auto-upload/conf" `
            --add-data "social-auto-upload/uploader;social-auto-upload/uploader" `
            --add-data "social-auto-upload/utils;social-auto-upload/utils" `
            --add-data "social-auto-upload/myUtils;social-auto-upload/myUtils" `
            --add-data "social-auto-upload/img;social-auto-upload/img" `
            --add-data "social-auto-upload/requirements.txt;social-auto-upload" `
            --hidden-import "uiautomator2" `
            --hidden-import "tenacity" `
            --hidden-import "loguru" `
            --hidden-import "filetype" `
            --icon "icon.ico" `
            desktop_app.py

      - name: Smoke test packaged exe (real Windows boot check)
        shell: pwsh
        run: |
          # --windowed exe 不挂控制台，Start-Process 不等待；改为轮询结果文件
          Start-Process -FilePath .\dist\OpenMatrixPublisher-Setup.exe -ArgumentList '--selftest' -PassThru | Out-Null
          $deadline = (Get-Date).AddSeconds(90)
          while (-not (Test-Path selftest_result.json) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if (-not (Test-Path selftest_result.json)) { Write-Error "Windows exe selftest timeout (no selftest_result.json)"; exit 1 }
          $r = Get-Content selftest_result.json | ConvertFrom-Json
          if ($r.ok -ne $true) { Write-Error "selftest_result.ok != true"; exit 1 }
          Write-Host "Windows exe selftest PASS"

      - name: Upload Windows Build Artifact (always, for testing)
        uses: actions/upload-artifact@v4
        with:
          name: OpenMatrixPublisher-Windows
          path: dist/OpenMatrixPublisher-Setup.exe

      - name: Upload Windows Release Asset
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/OpenMatrixPublisher-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
