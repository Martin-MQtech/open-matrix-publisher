name: Platform Count Consistency Check

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  check-platform-count:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run platform count check
        run: python scripts/check_platform_count.py --verbose
