<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Matrix Publisher · 全域矩阵</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg: #0b0e14;
            --surface: #141925;
            --surface-2: #0f1420;
            --border: rgba(255,255,255,0.08);
            --border-strong: rgba(255,255,255,0.14);
            --accent: #3b82f6;
            --accent-soft: rgba(59,130,246,0.12);
            --text: #e6e9ef;
            --muted: #8a93a6;
            --green: #22c55e;
            --amber: #f59e0b;
            --red: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', 'Noto Sans SC', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 0 20px 120px;
            -webkit-font-smoothing: antialiased;
        }

        .wrap { max-width: 880px; margin: 0 auto; }

        /* ---------- Header ---------- */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 22px 0 18px;
        }
        .brand { display: flex; align-items: center; gap: 12px; }
        .logo {
            width: 34px; height: 34px; border-radius: 9px;
            background: var(--accent);
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 16px;
        }
        .brand h1 { font-size: 16px; font-weight: 700; letter-spacing: .3px; }
        .brand span { font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 6px; }
        .head-right { display: flex; align-items: center; gap: 14px; }
        .mit-tag {
            font-size: 11px; color: var(--muted);
            border: 1px solid var(--border); border-radius: 20px;
            padding: 3px 10px;
        }
        .gh-link { color: var(--muted); font-size: 13px; text-decoration: none; display: flex; align-items: center; gap: 6px; }
        .gh-link:hover { color: var(--text); }

        /* ---------- Sections ---------- */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 16px;
        }
        .card-head {
            font-size: 13px; font-weight: 600; color: var(--muted);
            margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
        }
        .card-head i { color: var(--accent); }

        /* ---------- Video dropzone ---------- */
        .dropzone {
            border: 1.5px dashed var(--border-strong);
            border-radius: 12px;
            padding: 28px;
            text-align: center;
            cursor: pointer;
            transition: border-color .2s, background .2s;
        }
        .dropzone:hover, .dropzone.drag { border-color: var(--accent); background: var(--accent-soft); }
        .dropzone .dz-icon { font-size: 26px; color: var(--muted); margin-bottom: 8px; }
        .dropzone .dz-title { font-size: 14px; color: var(--text); font-weight: 600; }
        .dropzone .dz-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

        .video-loaded { display: none; }
        .video-loaded.active { display: block; }
        .video-preview {
            width: 100%; border-radius: 12px; background: #000;
            max-height: 340px; object-fit: contain; display: block;
        }
        .video-info {
            display: flex; align-items: center; justify-content: space-between;
            margin-top: 10px; font-size: 12px; color: var(--muted);
        }
        .video-info .fname { color: var(--text); font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .change-btn {
            background: none; border: 1px solid var(--border-strong); color: var(--muted);
            border-radius: 8px; padding: 5px 12px; font-size: 12px; cursor: pointer;
        }
        .change-btn:hover { color: var(--text); border-color: var(--accent); }

        /* ---------- Copy ---------- */
        .field { margin-bottom: 14px; }
        .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
        .input, .textarea {
            width: 100%; background: var(--surface-2);
            border: 1px solid var(--border); border-radius: 10px;
            padding: 11px 14px; color: var(--text); font-size: 14px; outline: none;
            font-family: inherit; transition: border-color .2s;
        }
        .input:focus, .textarea:focus { border-color: var(--accent); }
        .textarea { resize: vertical; min-height: 96px; line-height: 1.6; }

        .ai-toggle {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 12px; color: var(--accent); cursor: pointer;
            background: none; border: none; padding: 0; margin-top: 2px;
        }
        .ai-panel {
            display: none; margin-top: 12px; padding: 14px;
            background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
        }
        .ai-panel.open { display: block; }
        .ai-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .ai-btn {
            flex: 1; min-width: 120px; background: var(--surface); border: 1px solid var(--border-strong);
            border-radius: 9px; padding: 10px; color: var(--text); font-size: 12px; cursor: pointer;
            display: flex; flex-direction: column; gap: 4px; align-items: flex-start;
        }
        .ai-btn:hover { border-color: var(--accent); }
        .ai-btn b { font-size: 13px; }
        .ai-btn small { color: var(--muted); }
        .ai-paste {
            margin-top: 10px; width: 100%; background: var(--accent-soft); color: var(--accent);
            border: 1px solid rgba(59,130,246,.3); border-radius: 9px; padding: 8px;
            font-size: 12px; font-weight: 600; cursor: pointer;
        }

        /* ---------- Platforms ---------- */
        .group-label {
            font-size: 12px; color: var(--muted); margin: 4px 0 12px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .group-label a { color: var(--accent); font-size: 12px; cursor: pointer; text-decoration: none; }
        .pf-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
        @media (max-width: 720px) { .pf-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 480px) { .pf-grid { grid-template-columns: repeat(2, 1fr); } }

        .pf-chip {
            position: relative; background: var(--surface-2);
            border: 1px solid var(--border); border-radius: 11px;
            padding: 12px 10px 10px; cursor: pointer; text-align: center;
            transition: border-color .15s, background .15s;
        }
        .pf-chip:hover { border-color: var(--border-strong); }
        .pf-chip.sel { border-color: var(--accent); background: var(--accent-soft); }
        .pf-icon {
            width: 34px; height: 34px; border-radius: 9px; margin: 0 auto 7px;
            display: flex; align-items: center; justify-content: center; font-size: 16px;
        }
        .pf-name { font-size: 12px; font-weight: 600; color: var(--text); }
        .pf-dot {
            display: block; font-size: 10px; margin-top: 4px; color: var(--muted);
        }
        .pf-dot.logged { color: var(--green); }
        .pf-dot.need { color: var(--amber); }
        .pf-dot.off { color: var(--muted); }
        .pf-qr {
            position: absolute; top: 7px; right: 7px;
            background: none; border: none; color: var(--muted);
            font-size: 12px; cursor: pointer; opacity: .55;
        }
        .pf-qr:hover { color: var(--accent); opacity: 1; }

        /* ---------- Action bar ---------- */
        .action-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(11,14,20,.92); backdrop-filter: blur(10px);
            border-top: 1px solid var(--border);
            padding: 14px 20px;
        }
        .action-inner { max-width: 880px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
        .action-summary { font-size: 13px; color: var(--muted); }
        .action-summary b { color: var(--text); font-size: 15px; }
        .btn-go {
            background: var(--accent); color: #fff; border: none;
            border-radius: 11px; padding: 13px 28px; font-size: 15px; font-weight: 700;
            cursor: pointer; display: flex; align-items: center; gap: 8px;
        }
        .btn-go:hover { filter: brightness(1.08); }
        .btn-go:disabled { opacity: .45; cursor: not-allowed; }

        /* ---------- Modals ---------- */
        .overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,.8);
            display: none; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal {
            width: 480px; max-width: 92vw; background: var(--surface);
            border: 1px solid var(--border); border-radius: 16px; padding: 24px;
        }
        .modal h3 { font-size: 16px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
        .modal .box { background: var(--surface-2); border-radius: 10px; padding: 12px; font-size: 12px; margin-bottom: 16px; }
        .modal .box .vn { color: var(--accent); font-weight: 700; margin-bottom: 4px; }
        .modal .row { display: flex; justify-content: flex-end; gap: 10px; }
        .btn-ghost { background: rgba(255,255,255,.08); border: none; color: var(--text); padding: 9px 18px; border-radius: 9px; cursor: pointer; font-size: 13px; }
        .btn-ghost:hover { background: rgba(255,255,255,.14); }

        .prog-row { margin-bottom: 12px; }
        .prog-top { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; margin-bottom: 5px; }
        .prog-bg { height: 5px; background: rgba(255,255,255,.1); border-radius: 3px; overflow: hidden; }
        .prog-fill { height: 100%; width: 0; background: var(--accent); transition: width .3s; }

        /* ---------- Footer ---------- */
        footer {
            max-width: 880px; margin: 24px auto 0; padding-top: 16px;
            border-top: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            font-size: 12px; color: var(--muted); flex-wrap: wrap; gap: 10px;
        }
        footer a { color: var(--muted); text-decoration: none; }
        footer a:hover { color: var(--text); }
    </style>
</head>
<body>
    <div class="wrap">
        <header>
            <div class="brand">
                <div class="logo"><i class="fa-solid fa-share-nodes"></i></div>
                <h1>Open Matrix Publisher <span>全域矩阵</span></h1>
            </div>
            <div class="head-right">
                <span class="mit-tag">MIT 开源</span>
                <a class="gh-link" href="https://github.com/Martin-MQtech/open-matrix-publisher" target="_blank"><i class="fa-brands fa-github"></i> GitHub</a>
            </div>
        </header>

        <!-- 1. 视频 -->
        <section class="card">
            <div class="card-head"><i class="fa-solid fa-film"></i> 选择视频</div>

            <div class="dropzone" id="dropzone" onclick="document.getElementById('local-file-input').click()">
                <div class="dz-icon"><i class="fa-solid fa-cloud-arrow-up"></i></div>
                <div class="dz-title">点击或拖拽视频到此处</div>
                <div class="dz-sub">支持 mp4 / mov / avi / mkv / webm</div>
            </div>
            <input type="file" id="local-file-input" accept="video/*" style="display:none;" onchange="handleLocalFileSelect(this)">

            <div class="video-loaded" id="video-loaded">
                <video id="main-video" class="video-preview" controls playsinline></video>
                <div class="video-info">
                    <span class="fname"><i class="fa-solid fa-file-video"></i> <span id="selected-video-filename">—</span></span>
                    <span id="video-size">—</span>
                </div>
                <div style="margin-top:10px; text-align:right;">
                    <button class="change-btn" onclick="document.getElementById('local-file-input').click()">更换视频</button>
                </div>
            </div>
        </section>

        <!-- 2. 文案 -->
        <section class="card">
            <div class="card-head"><i class="fa-solid fa-pen"></i> 文案（可选）</div>
            <div class="field">
                <label>标题</label>
                <input class="input" type="text" id="post-title" placeholder="给视频起个标题，将同步到各平台">
            </div>
            <div class="field">
                <label>正文描述</label>
                <textarea class="textarea" id="post-desc" placeholder="写一段描述，可留空"></textarea>
            </div>
            <button class="ai-toggle" onclick="toggleAi()"><i class="fa-solid fa-wand-magic-sparkles"></i> 用 AI 写文案</button>
            <div class="ai-panel" id="ai-panel">
                <div class="ai-row">
                    <button class="ai-btn" onclick="openAiWebPage('doubao')"><b>豆包</b><small>短视频口播</small></button>
                    <button class="ai-btn" onclick="openAiWebPage('kimi')"><b>Kimi</b><small>长文本结构</small></button>
                    <button class="ai-btn" onclick="openAiWebPage('tongyi')"><b>通义千问</b><small>中英双语</small></button>
                </div>
                <button class="ai-paste" onclick="parseFromClipboard()"><i class="fa-solid fa-paste"></i> 粘贴并认领复制的文案</button>
            </div>
        </section>

        <!-- 3. 平台 -->
        <section class="card">
            <div class="card-head"><i class="fa-solid fa-layer-group"></i> 选择分发平台</div>

            <div class="group-label">国内平台 <a onclick="toggleCategory('cn')">全选 / 取消</a></div>
            <div class="pf-grid" id="cn-mini-grid"></div>

            <div class="group-label">国际平台 <a onclick="toggleCategory('global')">全选 / 取消</a></div>
            <div class="pf-grid" id="global-mini-grid"></div>
        </section>

        <footer>
            <span>Open Matrix Publisher · 全域矩阵 · 一条视频，静默分发到 14+ 平台</span>
            <span><a href="https://martin-mqtech.github.io/open-matrix-publisher/" target="_blank">文档</a> · v1.0</span>
        </footer>
    </div>

    <!-- 底部操作栏 -->
    <div class="action-bar">
        <div class="action-inner">
            <div class="action-summary">已选 <b id="selected-count">0</b> / 14 个平台</div>
            <button class="btn-go" id="go-btn" onclick="openConfirmDialog()" disabled>
                <i class="fa-solid fa-paper-plane"></i> 一键分发
            </button>
        </div>
    </div>

    <!-- 确认弹窗 -->
    <div id="confirm-modal" class="overlay">
        <div class="modal">
            <h3><i class="fa-solid fa-paper-plane" style="color:var(--accent)"></i> 确认分发</h3>
            <div class="box">
                <div class="vn" id="confirm-video-name">—</div>
                <div style="color:var(--muted);">目标平台：<span id="confirm-count" style="color:var(--accent); font-weight:700;">0</span> 个</div>
            </div>
            <div class="row">
                <button class="btn-ghost" onclick="closeConfirmDialog()">取消</button>
                <button class="btn-go" style="padding:9px 20px;" onclick="confirmAndDispatch()">开始发送</button>
            </div>
        </div>
    </div>

    <!-- 进度弹窗 -->
    <div id="modal" class="overlay">
        <div class="modal">
            <h3><i class="fa-solid fa-spinner fa-spin" style="color:var(--accent)"></i> 正在分发…</h3>
            <div id="progress-list"></div>
            <div style="margin-top:18px; text-align:right;">
                <button id="close-modal-btn" class="btn-go" style="display:none; padding:9px 18px;" onclick="closeModal()">完成并关闭</button>
            </div>
        </div>
    </div>

    <script>
        const PLATFORMS = [
            { id: "tencent", name: "视频号", cat: "cn", color: "#07c160", icon: "fa-weixin" },
            { id: "douyin", name: "抖音", cat: "cn", color: "#000000", icon: "fa-tiktok" },
            { id: "bilibili", name: "B站", cat: "cn", color: "#00a1d6", icon: "fa-play" },
            { id: "kuaishou", name: "快手", cat: "cn", color: "#ff5000", icon: "fa-video" },
            { id: "weibo", name: "微博", cat: "cn", color: "#e6162d", icon: "fa-weibo" },
            { id: "toutiao", name: "头条", cat: "cn", color: "#f04142", icon: "fa-newspaper" },
            { id: "zhihu", name: "知乎", cat: "cn", color: "#0066ff", icon: "fa-brain" },
            { id: "xiaohongshu", name: "小红书", cat: "cn", color: "#ff2442", icon: "fa-book-bookmark" },

            { id: "youtube", name: "YouTube", cat: "global", color: "#ff0000", icon: "fa-youtube" },
            { id: "facebook", name: "Facebook", cat: "global", color: "#1877f2", icon: "fa-facebook" },
            { id: "x", name: "X", cat: "global", color: "#000000", icon: "fa-x-twitter" },
            { id: "linkedin", name: "LinkedIn", cat: "global", color: "#0a66c2", icon: "fa-linkedin" },
            { id: "instagram", name: "Instagram", cat: "global", color: "#e4405f", icon: "fa-instagram" },
            { id: "tiktok", name: "TikTok", cat: "global", color: "#00f2fe", icon: "fa-tiktok" }
        ];

        const AI_PORTALS = {
            "doubao": "https://www.doubao.com/chat/",
            "kimi": "https://kimi.moonshot.cn/",
            "tongyi": "https://tongyi.aliyun.com/qianwen/"
        };

        let selectedFile = null;
        let uploadedVideoPath = "";  // 已上传到本地桥接服务的绝对路径（浏览器拿不到真实路径，必须上传）

        function getCleanTopic() {
            let fn = document.getElementById('selected-video-filename').innerText;
            if (!fn || fn === '—') return "我的视频作品";
            fn = fn.replace(/\.(mp4|mov|avi|mkv|webm)$/i, '');
            fn = fn.replace(/_(中文|英文|宣传片|电影级|成片|v\d+)/g, '');
            return fn.trim() || "我的视频作品";
        }

        function openAiWebPage(key) {
            const cleanTopic = getCleanTopic();
            const promptText = `请帮我为【${cleanTopic}】写一段适合短视频平台发布的文案：\n标题：（控制在 28 字以内，有吸引力）\n正文：（突出核心看点，口语化、有共鸣）\n话题标签：3-5 个`;
            navigator.clipboard.writeText(promptText).then(() => {
                alert(`主题词【${cleanTopic}】已复制，打开 ${key} 后按 Cmd+V / Ctrl+V 粘贴。`);
                window.open(AI_PORTALS[key], '_blank');
            }).catch(() => { window.open(AI_PORTALS[key], '_blank'); });
        }

        async function parseFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                if (!text || !text.trim()) { alert("剪贴板为空，请先在 AI 网页复制文案。"); return; }
                const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                if (lines.length > 0) {
                    document.getElementById('post-title').value = lines[0].replace(/^标题[：:]\s*/, '').replace(/^[#【\s]*/, '').slice(0, 80);
                    if (lines.length > 1) document.getElementById('post-desc').value = lines.slice(1).join('\n').replace(/^正文[：:]\s*/, '');
                    alert("已认领文案并填入。");
                }
            } catch (err) { alert("请允许浏览器读取剪贴板，或直接手动粘贴。"); }
        }

        function toggleAi() {
            document.getElementById('ai-panel').classList.toggle('open');
        }

        function formatSize(bytes) {
            if (!bytes) return "—";
            const mb = bytes / (1024 * 1024);
            if (mb >= 1) return mb.toFixed(1) + " MB";
            return Math.max(1, Math.round(bytes / 1024)) + " KB";
        }

        function handleLocalFileSelect(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                document.getElementById('selected-video-filename').innerText = file.name;
                selectedFile = file;
                uploadedVideoPath = "";
                document.getElementById('video-size').innerText = formatSize(file.size);
                document.getElementById('main-video').src = URL.createObjectURL(file);
                document.getElementById('video-loaded').classList.add('active');
                document.getElementById('dropzone').style.display = 'none';
                updateSelectedSummary();
            }
        }

        // 拖拽支持
        const dz = document.getElementById('dropzone');
        ['dragover','dragenter'].forEach(e => dz.addEventListener(e, ev => { ev.preventDefault(); dz.classList.add('drag'); }));
        ['dragleave','drop'].forEach(e => dz.addEventListener(e, ev => { ev.preventDefault(); dz.classList.remove('drag'); }));
        dz.addEventListener('drop', ev => {
            if (ev.dataTransfer.files && ev.dataTransfer.files[0]) {
                const fi = document.getElementById('local-file-input');
                fi.files = ev.dataTransfer.files;
                handleLocalFileSelect(fi);
            }
        });

        function renderMiniGrids() {
            const cnGrid = document.getElementById('cn-mini-grid');
            const globalGrid = document.getElementById('global-mini-grid');
            PLATFORMS.forEach(p => {
                const card = document.createElement('div');
                card.className = 'pf-chip';
                card.id = `card-${p.id}`;
                card.onclick = () => { card.classList.toggle('sel'); updateSelectedSummary(); };
                card.innerHTML = `
                    <button class="pf-qr" title="扫码登录" onclick="launchQrLogin('${p.id}', event)"><i class="fa-solid fa-qrcode"></i></button>
                    <div class="pf-icon" style="background:${p.color}22; color:${p.color};"><i class="fa-brands ${p.icon}"></i></div>
                    <div class="pf-name">${p.name}</div>
                    <span class="pf-dot off" id="status-pill-${p.id}"><i class="fa-regular fa-circle"></i> 待校验</span>
                `;
                (p.cat === 'cn' ? cnGrid : globalGrid).appendChild(card);
            });
            updateSelectedSummary();
        }
        renderMiniGrids();

        function updateSelectedSummary() {
            const selected = document.querySelectorAll('.pf-chip.sel');
            document.getElementById('selected-count').innerText = selected.length;
            document.getElementById('go-btn').disabled = !(selectedFile && selected.length > 0);
        }

        function clearAllSelections() {
            document.querySelectorAll('.pf-chip').forEach(c => c.classList.remove('sel'));
            updateSelectedSummary();
        }

        function toggleCategory(cat) {
            const list = PLATFORMS.filter(p => p.cat === cat);
            const allSel = list.every(p => document.getElementById(`card-${p.id}`).classList.contains('sel'));
            list.forEach(p => document.getElementById(`card-${p.id}`).classList.toggle('sel', !allSel));
            updateSelectedSummary();
        }

        // API 基地址
        const API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? '' : 'http://localhost:5001';

        async function refreshSessionStatus() {
            try {
                const res = await fetch(API_BASE + '/api/status');
                const data = await res.json();
                const sessions = data.sessions || {};
                PLATFORMS.forEach(p => {
                    const pill = document.getElementById(`status-pill-${p.id}`);
                    if (!pill) return;
                    const sess = sessions[p.id] || {};
                    if (sess.logged_in) {
                        pill.className = 'pf-dot logged';
                        pill.innerHTML = '<i class="fa-solid fa-circle-check"></i> 已登录';
                    } else {
                        pill.className = 'pf-dot need';
                        pill.innerHTML = '<i class="fa-solid fa-qrcode"></i> 需扫码';
                    }
                });
            } catch (err) {
                PLATFORMS.forEach(p => {
                    const pill = document.getElementById(`status-pill-${p.id}`);
                    if (pill) { pill.className = 'pf-dot off'; pill.innerHTML = '<i class="fa-solid fa-plug-circle-xmark"></i> 未连接'; }
                });
            }
        }

        async function launchQrLogin(platformId, event) {
            if (event) event.stopPropagation();
            try {
                const res = await fetch(API_BASE + '/api/launch-login', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ platform_id: platformId })
                });
                const data = await res.json();
                alert(`🚀 ${data.msg}`);
                refreshSessionStatus();
            } catch (err) { alert("⚠️ 无法连接本地服务 (localhost:5001)，请先运行 ./start_ui.sh"); }
        }

        function openConfirmDialog() {
            if (!selectedFile) { alert("请先选择视频。"); return; }
            const selected = document.querySelectorAll('.pf-chip.sel');
            if (selected.length === 0) { alert("请至少勾选 1 个平台。"); return; }
            document.getElementById('confirm-video-name').innerText = document.getElementById('selected-video-filename').innerText;
            document.getElementById('confirm-count').innerText = selected.length;
            document.getElementById('confirm-modal').style.display = 'flex';
        }
        function closeConfirmDialog() { document.getElementById('confirm-modal').style.display = 'none'; }
        function confirmAndDispatch() { closeConfirmDialog(); startRealDispatch(); }

        async function uploadVideoToServer() {
            const fd = new FormData();
            fd.append("file", selectedFile);
            const res = await fetch(API_BASE + '/api/upload-video', { method: 'POST', body: fd });
            const j = await res.json();
            if (!res.ok || !j.saved_path) throw new Error(j.error || "未知错误");
            return j.saved_path;
        }

        function trackRealPythonTask(p, taskId, onComplete) {
            const statusEl = document.getElementById(`status-${p.id}`);
            const fillEl = document.getElementById(`fill-${p.id}`);
            const rowEl = document.getElementById(`row-${p.id}`);
            // 标记当前正在执行
            if (rowEl) rowEl.style.borderLeft = '3px solid var(--accent)';
            let pollCount = 0;
            const poll = setInterval(async () => {
                pollCount++;
                try {
                    const res = await fetch(`${API_BASE}/api/task-progress?task_id=${taskId}`);
                    const info = await res.json();
                    if (info.pct !== undefined) {
                        fillEl.style.width = `${Math.min(info.pct, 100)}%`;
                        if (info.pct >= 40) fillEl.style.background = 'var(--accent)';
                    }
                    if (info.stage) statusEl.innerText = info.stage;
                    if (info.status === 'completed') {
                        clearInterval(poll);
                        if (rowEl) rowEl.style.borderLeft = '3px solid var(--green)';
                        statusEl.innerHTML = `<span style="color:var(--green);font-weight:700;"><i class="fa-solid fa-circle-check"></i> 发布成功</span>`;
                        fillEl.style.width = '100%'; fillEl.style.background = 'var(--green)';
                        onComplete(true);
                    } else if (info.status === 'failed') {
                        clearInterval(poll);
                        if (rowEl) rowEl.style.borderLeft = '3px solid var(--red)';
                        const errText = (info.error || '失败').substring(0, 60);
                        statusEl.innerHTML = `<span style="color:var(--red);font-weight:700;" title="${errText}"><i class="fa-solid fa-circle-xmark"></i> ${errText}</span>`;
                        fillEl.style.width = '100%'; fillEl.style.background = 'var(--red)';
                        onComplete(false);
                    } else if (pollCount > 1200) { // 超过 10 分钟强制停止轮询
                        clearInterval(poll);
                        statusEl.innerHTML = `<span style="color:var(--amber);"><i class="fa-solid fa-clock"></i> 执行超时（后台仍在运行）</span>`;
                        onComplete(false); // 不阻塞后续平台
                    }
                } catch (err) { /* 网络抖动不中断 */ }
            }, 800);
        }

        async function startRealDispatch() {
            const modal = document.getElementById('modal');
            const list = document.getElementById('progress-list');
            const closeBtn = document.getElementById('close-modal-btn');
            modal.style.display = 'flex'; closeBtn.style.display = 'none'; list.innerHTML = '';

            if (!selectedFile) { alert("请先选择视频。"); modal.style.display = 'none'; return; }
            // 浏览器出于安全拿不到文件真实路径，必须把文件本体上传到本地桥接服务，
            // 由服务端保存为绝对路径后再交给上传引擎。
            if (!uploadedVideoPath) {
                const uh = document.createElement('div');
                uh.className = 'prog-row'; uh.id = 'uploading-hint';
                uh.innerHTML = `<div class="prog-top"><span><i class="fa-solid fa-spinner fa-spin"></i> 正在上传视频到本地服务…</span></div>`;
                list.appendChild(uh);
                try {
                    uploadedVideoPath = await uploadVideoToServer();
                } catch (e) {
                    uh.remove();
                    alert("⚠️ 视频上传到本地服务失败：" + (e.message || e) + "\n请确认 ./start_ui.sh 控制台正在运行。");
                    modal.style.display = 'none';
                    return;
                }
                uh.remove();
            }
            const selected = document.querySelectorAll('.pf-chip.sel');
            const activePlatforms = Array.from(selected).map(c => PLATFORMS.find(p => p.id === c.id.replace('card-', '')));
            const title = document.getElementById('post-title').value;
            const desc = document.getElementById('post-desc').value;
            const targetVideo = uploadedVideoPath;

            activePlatforms.forEach((p, idx) => {
                const item = document.createElement('div');
                item.className = 'prog-row'; item.id = `row-${p.id}`;
                const queueLabel = idx === 0 ? '（即将开始）' : `（排队第 ${idx} 位）`;
                item.innerHTML = `
                    <div class="prog-top"><span><i class="fa-brands ${p.icon}" style="color:${p.color};"></i> ${p.name}</span>
                    <span id="status-${p.id}" style="color:var(--muted);">就绪 ${queueLabel}</span></div>
                    <div class="prog-bg"><div class="prog-fill" id="fill-${p.id}"></div></div>`;
                list.appendChild(item);
            });

            for (const p of activePlatforms) {
                try {
                    const startRes = await fetch(API_BASE + '/api/start-upload-task', {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ platform_id: p.id, video_file: targetVideo, title: title, desc: desc, tags: [] })
                    });
                    const startData = await startRes.json();
                    if (startRes.status === 409 || startData.status === 'blocked_duplicate') {
                        const statusEl = document.getElementById(`status-${p.id}`);
                        const fillEl = document.getElementById(`fill-${p.id}`);
                        statusEl.innerHTML = `<span style="color:var(--amber);font-weight:700;"><i class="fa-solid fa-lock"></i> 已发布 · 防重拦截</span>`;
                        fillEl.style.width = '100%'; fillEl.style.background = 'var(--amber)';
                        continue;
                    }
                    if (startData.task_id) await new Promise(resolve => trackRealPythonTask(p, startData.task_id, resolve));
                } catch (err) { console.error(err); }
            }
            closeBtn.style.display = 'block';
            refreshSessionStatus();
        }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        refreshSessionStatus();
    </script>
</body>
</html>
