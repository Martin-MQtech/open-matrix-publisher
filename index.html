                card.id = `card-${p.id}`;
                card.setAttribute('data-platform-id', p.id);
                card.onclick = () => card.classList.toggle('selected');

                card.innerHTML = `
                    <div class="platform-card-header">
                        <div class="platform-info">
                            <div class="platform-icon" style="background: ${p.color}22; color: ${p.color};">
                                <i class="fa-brands ${p.icon}"></i>
                            </div>
                            <div>
                                <div class="platform-name">${p.name}</div>
                                <div class="platform-type">${p.cat === 'cn' ? '国内平台' : '海外平台'}</div>
                            </div>
                        </div>
                        <div class="checkbox-custom"><i class="fa-solid fa-check" style="font-size:12px;"></i></div>
                    </div>
                    <div style="display:flex; align-items:center; justify-content:space-between; margin-top:8px;">
                        <span id="session-${p.id}" class="session-status-pill session-active">✅ Cookie就绪</span>
                        <button onclick="launchQrLogin('${p.id}', event)" style="background:none; border:none; color:var(--accent-cyan); font-size:11px; cursor:pointer;"><i class="fa-solid fa-qrcode"></i> 扫码/刷新</button>
                    </div>
                `;

                if (p.cat === 'cn') cnGrid.appendChild(card);
                else globalGrid.appendChild(card);
            });
        }

        renderGrids();

        async function refreshSessionStatus() {
            try {
                const res = await fetch('http://localhost:5001/api/status');
                const data = await res.json();
                
                const currentVideo = document.getElementById('video-src').getAttribute('src');
                const currentVideoName = currentVideo.split('/').pop();
                const pubMap = data.published_map || {};
                const currentPubs = pubMap[currentVideoName] || {};

                // Update cards with published state & locked badges
                PLATFORMS.forEach(p => {
                    const card = document.querySelector(`[data-platform-id="${p.id}"]`);
                    const pubInfo = currentPubs[p.id];
                    if (pubInfo && card) {
                        card.style.borderColor = 'var(--accent-gold)';
                        let existingNotice = card.querySelector('.pub-notice');
                        if (!existingNotice) {
                            const notice = document.createElement('div');
                            notice.className = 'pub-notice';
                            notice.style.cssText = 'margin-top:6px;padding:4px 8px;border-radius:6px;background:rgba(255,215,0,0.15);color:var(--accent-gold);font-size:11px;font-weight:700;text-align:center;display:flex;align-items:center;justify-content:space-between;';
                            notice.innerHTML = `<span>🔒 已于 ${pubInfo.finish_time.split(' ')[1]} 成功发布</span><a href="${pubInfo.link}" target="_blank" onclick="event.stopPropagation()" style="color:var(--accent-gold);"><i class="fa-solid fa-arrow-up-right-from-square"></i></a>`;
                            card.appendChild(notice);
                        }
                    }
                });
            } catch (err) {
                console.log("Status sync warning:", err);
            }
        }

        async function launchQrLogin(platformId, event) {
            if (event) event.stopPropagation();
            try {
                const res = await fetch('http://localhost:5001/api/launch-login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ platform_id: platformId })
                });
                const data = await res.json();
                alert(`🚀 ${data.msg}`);
                refreshSessionStatus();
            } catch (err) {
                alert("⚠️ 无法连接本地 Python API 服务 (http://localhost:5001)！");
            }
        }

        function openConfirmDialog() {
            const selectedCards = document.querySelectorAll('.platform-card.selected');
            if (selectedCards.length === 0) {
                alert("请至少选择 1 个推送平台！");
                return;
            }
            document.getElementById('confirm-count').innerText = selectedCards.length;
            document.getElementById('confirm-modal').style.display = 'flex';
        }

        function closeConfirmDialog() {
            document.getElementById('confirm-modal').style.display = 'none';
        }

        function confirmAndDispatch() {
            closeConfirmDialog();
            startRealDispatch();
        }

        function trackRealPythonTask(p, taskId, onComplete) {
            const statusEl = document.getElementById(`status-${p.id}`);
            const fillEl = document.getElementById(`fill-${p.id}`);

            const pollInterval = setInterval(async () => {
                try {
                    const res = await fetch(`http://localhost:5001/api/task-progress?task_id=${taskId}`);
                    const info = await res.json();

                    if (info.pct !== undefined) fillEl.style.width = `${info.pct}%`;

                    if (info.stage) statusEl.innerText = info.stage;

                    if (info.status === 'completed') {
                        clearInterval(pollInterval);
                        statusEl.innerHTML = `
                            <span style="color: var(--accent-green); font-weight: 700;">
                                <i class="fa-solid fa-circle-check"></i> ${info.stage}
                            </span>
                            <a href="${info.link}" target="_blank" style="color:var(--accent-cyan); margin-left:8px;"><i class="fa-solid fa-arrow-up-right-from-square"></i> 打开后台校验</a>
                        `;
                        fillEl.style.width = '100%';
                        fillEl.style.background = 'var(--accent-green)';
                        onComplete(true);
                    } else if (info.status === 'failed') {
                        clearInterval(pollInterval);
                        statusEl.innerHTML = `<span style="color: var(--accent-red); font-weight: 700;"><i class="fa-solid fa-circle-xmark"></i> ${info.error || '上传未成功'}</span>`;
                        fillEl.style.width = '100%';
                        fillEl.style.background = 'var(--accent-red)';
                        onComplete(false);
                    }
                } catch (err) {
                    clearInterval(pollInterval);
                    onComplete(false);
                }
            }, 500);
        }

        async function startRealDispatch() {
            const modal = document.getElementById('modal');
            const list = document.getElementById('progress-list');
            const closeBtn = document.getElementById('close-modal-btn');
            
            modal.style.display = 'flex';
            closeBtn.style.display = 'none';
            list.innerHTML = '';

            const selectedCards = document.querySelectorAll('.platform-card.selected');
            const activePlatforms = Array.from(selectedCards).map(c => {
                const id = c.id.replace('card-', '');
                return PLATFORMS.find(p => p.id === id);
            });

            const title = document.getElementById('post-title').value;
            const desc = document.getElementById('post-desc').value;
            const videoSrc = document.getElementById('video-src').getAttribute('src');

            let successCount = 0;
            let failCount = 0;

            activePlatforms.forEach(p => {
                const item = document.createElement('div');
                item.className = 'progress-row';
                item.id = `row-${p.id}`;
                item.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600;">
                        <span><i class="fa-brands ${p.icon}" style="color: ${p.color}; font-size: 16px;"></i> ${p.name}</span>
                        <span id="status-${p.id}" style="color: var(--text-muted);">等待 Python 后端分配任务...</span>
                    </div>
                    <div class="progress-fill-bg">
                        <div class="progress-fill" id="fill-${p.id}" style="width: 0%;"></div>
                    </div>
                `;
                list.appendChild(item);
            });

            for (const p of activePlatforms) {
                try {
                    const startRes = await fetch('http://localhost:5001/api/start-upload-task', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            platform_id: p.id,
                            video_file: videoSrc,
                            title: title,
                            desc: desc,
                            tags: ["富氢热灸贴", "木齐科技", "温氢双护"]
                        })
                    });
                    const startData = await startRes.json();

                    if (startRes.status === 409 || startData.status === 'blocked_duplicate') {
                        showNotification(`⚠️ ${p.name}：系统已自动拦截重复发布`, 'warning');
                        const statusEl = document.getElementById(`status-${p.id}`);
                        const fillEl = document.getElementById(`fill-${p.id}`);
                        statusEl.innerHTML = `<span style="color:var(--accent-gold); font-weight:700;">🔒 已发布 · 防重机制自动拦截</span>`;
                        fillEl.style.width = '100%';
                        fillEl.style.background = 'var(--accent-gold)';
                        continue;
                    }

                    if (startData.task_id) {
                        await new Promise(resolve => {
                            trackRealPythonTask(p, startData.task_id, resolve);
                        });
                    }
                } catch (err) {
                    console.error(err);
                }
            }

            closeBtn.style.display = 'block';
            refreshSessionStatus();
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        refreshSessionStatus();
    </script>
</body>
</html>
